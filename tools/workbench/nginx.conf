# The workbench: one page with a tab per tool, and a reverse proxy so every VM-hosted
# tool is reachable from that one page on one port. Each tool keeps serving itself at
# "/" on its own port; the rewrite strips the /<tool>/ prefix, so the tools never need to
# know they sit behind a prefix. Their pages use relative asset and API paths for the
# same reason.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Docker's embedded DNS. With a literal host in proxy_pass nginx resolves it once at
  # start: it refuses to start while a tool is down, and keeps an old IP after a tool is
  # recreated (502 until the workbench restarts). A variable makes it resolve per request.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $task_notif  http://task-notif:4310;
  set $keep_alive  http://keep-alive:4311;

  # Relative Location headers on nginx's own redirects. The absolute form uses the Host
  # name without the port, so /keep-alive -> http://localhost/keep-alive/ through an SSH
  # tunnel on 4300, which is the wrong port.
  absolute_redirect off;

  # Platform health checks send no credentials, so this must answer before anything else.
  location = /healthz {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  location = / {
    try_files /index.html =404;
  }

  # Without these, /task-notif (no slash) would be proxied as "" and 404.
  location = /task-notif  { return 301 /task-notif/; }
  location = /keep-alive  { return 301 /keep-alive/; }

  location /task-notif/ {
    rewrite ^/task-notif/(.*)$ /$1 break;
    proxy_pass $task_notif;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /task-notif;
    # A Location from the tool, absolute (its own host) or relative (serve-static's
    # directory redirect), would point outside the prefix without these.
    proxy_redirect http://task-notif:4310/ /task-notif/;
    proxy_redirect / /task-notif/;
    # A dry-run preview scans every task in Teamwork and can take a minute; the
    # default 60 s would cut it off with a 504 while the tool is still working.
    proxy_read_timeout 180s;
  }

  location /keep-alive/ {
    rewrite ^/keep-alive/(.*)$ /$1 break;
    proxy_pass $keep_alive;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /keep-alive;
    proxy_redirect http://keep-alive:4311/ /keep-alive/;
    proxy_redirect / /keep-alive/;
    # Pressing Start waits for the first look at the instance, which fetches the
    # instance and its maintenance page; 20 s each in the keeper, so allow both.
    proxy_read_timeout 60s;
  }
}
