# The workbench: one page with a tab per tool, and a reverse proxy so every VM-hosted
# tool is reachable from that one page on one port. Each tool keeps serving itself at
# "/" on its own port; the trailing slash on proxy_pass strips the /<tool>/ prefix, so
# the tools never need to know they sit behind a prefix. Their pages use relative asset
# and API paths for the same reason.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Platform health checks send no credentials, so this must answer before anything else.
  location = /healthz {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  location = / {
    try_files /index.html =404;
  }

  # Without these, /task-notif (no slash) would be proxied as "" and 404.
  location = /task-notif  { return 301 /task-notif/; }
  location = /keep-alive  { return 301 /keep-alive/; }

  location /task-notif/ {
    proxy_pass http://task-notif:4310/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /task-notif;
    # A dry-run preview scans every task in Teamwork and can take a minute; the
    # default 60 s would cut it off with a 504 while the tool is still working.
    proxy_read_timeout 180s;
  }

  location /keep-alive/ {
    proxy_pass http://keep-alive:4311/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /keep-alive;
    # Pressing Start waits for the first look at the instance, which fetches the
    # instance and its maintenance page; 20 s each in the keeper, so allow both.
    proxy_read_timeout 60s;
  }
}
