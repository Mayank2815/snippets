services:
  keep-alive:
    build: .
    image: keep-alive:latest
    container_name: keep-alive
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      # The one-off import from task-notif is handled by the repo's deploy stack
      # (deploy/deploy.sh snapshots store.json into ./data before anything restarts, and
      # deploy/docker-compose.yml points LEGACY_TASK_NOTIF_STORE at the snapshot). Do not
      # mount task-notif's live data here: the new task-notif erases the keepAlive block
      # on its next write, so reading the live file is a race you will usually lose.
    ports:
      # Bound to loopback on purpose: without DASHBOARD_PASSWORD there is no authentication,
      # so it must not be reachable from the internet. Use an SSH tunnel to open it.
      # 4311 because task-notif already has 4310 on the same VM.
      - "127.0.0.1:4311:4311"
